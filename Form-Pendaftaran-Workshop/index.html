<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Workshop</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <span class="label">WORKSHOP REGISTRATION</span>
            <h1>Form Pendaftaran Workshop</h1>
            <p>
                Silakan lengkapi formulir berikut untuk mendaftarkan
                diri sebagai peserta workshop.
            </p>
        </header>

        <!-- Form Pendaftaran -->
        <main class="content">

            <form id="formWorkshop" novalidate>

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" maxlength="50">
                    <div class="input-info">
                        <small id="errorNama"></small>
                        <small id="jumlahKarakter">0/50 karakter</small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" name="email" placeholder="contoh@email.com">
                    <small class="error" id="errorEmail"></small>
                </div>

                <div class="form-group">
                    <label for="sesi">Pilihan Sesi Workshop</label>
                    <select id="sesi" name="sesi">
                        <option value="">-- Pilih Sesi Workshop --</option>
                        <option value="Sesi 1 - 09.00 WIB">
                            Sesi 1 - 09.00 WIB
                        </option>
                        <option value="Sesi 2 - 13.00 WIB">
                            Sesi 2 - 13.00 WIB
                        </option>
                        <option value="Sesi 3 - 15.00 WIB">
                            Sesi 3 - 15.00 WIB
                        </option>
                    </select>
                    <small class="error" id="errorSesi"></small>
                </div>

                <!-- Ringkasan Input -->
                <div class="summary">
                    <h3>Ringkasan Pendaftaran</h3>

                    <div class="summary-item">
                        <span>Nama</span>
                        <strong id="ringkasanNama">-</strong>
                    </div>

                    <div class="summary-item">
                        <span>Email</span>
                        <strong id="ringkasanEmail">-</strong>
                    </div>

                    <div class="summary-item">
                        <span>Sesi</span>
                        <strong id="ringkasanSesi">-</strong>
                    </div>
                </div>

                <!-- Pesan Status -->
                <div id="pesanStatus" class="status" aria-live="polite"></div>

                <!-- Tombol -->
                <div class="button-group">
                    <button type="submit" class="btn-submit">
                        Daftar Workshop
                    </button>

                    <button type="button" id="tombolReset" class="btn-reset">
                        Reset
                    </button>
                </div>

            </form>

        </main>

        <footer>
            <p>Praktikum 6 - JavaScript DOM dan Event Handling</p>
        </footer>

    </div>

</body>

</html>
